# A workflow run is made up of one or more jobs that can run
# sequentially or in parallel
on:
  push:
    branches: [master, develop]
  pull_request:
name: Run tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-agent:
    name: Build Agent
    uses: ./.github/workflows/agent-cpp.yml

  tests:
    name: Tests (${{ matrix.os }}, agent=${{ matrix.with-agent }})
    needs: build-agent

    strategy:
      matrix:
        # TODO add windows-latest
        os: [ubuntu-latest, macOS-latest]
        with-agent: [false, true]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Prepare java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install clojure tools
      uses: DeLaGuardo/setup-clojure@10.1
      with:
        cli: 1.11.1.1208

    - name: Install node
      uses: actions/setup-node@v4
      with:
       node-version: '20'

    - name: Install vega-cli
      run: |
        npm install -g vega vega-lite vega-cli

    - name: Install babashka
      uses: turtlequeue/setup-babashka@v1.5.0
      with:
        babashka-version: 0.7.0

    - name: Setup clj-kondo
      uses: DeLaGuardo/setup-clj-kondo@master
      with:
        version: '2024.09.27'

    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0          # all commits for git-rev-count

    - name: Download agent artifact (Linux)
      if: matrix.with-agent && matrix.os == 'ubuntu-latest'
      uses: actions/download-artifact@v4
      with:
        name: agent-cpp-linux-x64
        path: agent-cpp/build

    - name: Download agent artifact (macOS)
      if: matrix.with-agent && matrix.os == 'macOS-latest'
      uses: actions/download-artifact@v4
      with:
        name: agent-cpp-macos-arm64
        path: agent-cpp/build

    - name: Verify agent binary
      if: matrix.with-agent
      run: |
        ls -la agent-cpp/build/
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          test -f agent-cpp/build/libcriterium.so
        else
          test -f agent-cpp/build/libcriterium.dylib
        fi

    - name: prep deps
      run: |
        set -x
        clojure -T:build javac :project :agent :class-dir '"bases/agent/target/classes"' :verbose true
        ls -laR bases/agent/target/classes/ || echo "No target/classes directory"
        clojure -T:build javac :project :blackhole :class-dir '"bases/blackhole/target/classes"' :verbose true
        ls -laR bases/blackhole/target/classes/ || echo "No target/classes directory"
        clojure -P -A:test:dev

    - name: build jar
      run: |
        set -x
        clojure -T:build jar :project :criterium :verbose true

    - name: test
      run: |
        set -x
        if [[ "${{ matrix.with-agent }}" == "true" ]]; then
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            clojure -M:kaocha:dev:test:with-agent-linux :all --reporter dots
          else
            clojure -M:kaocha:dev:test:with-agent-mac :all --reporter dots
          fi
        else
          clojure -M:kaocha:dev:test :all --reporter dots
        fi

    - name: slow tests
      run: |
        set -x
        if [[ "${{ matrix.with-agent }}" == "true" ]]; then
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            clojure -M:kaocha:dev:test:with-agent-linux :slow --reporter dots
          else
            clojure -M:kaocha:dev:test:with-agent-mac :slow --reporter dots
          fi
        else
          clojure -M:kaocha:dev:test :slow --reporter dots
        fi

    - name: Install R (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y r-base

    - name: Install R (macOS)
      if: matrix.os == 'macOS-latest'
      run: |
        brew install r

    - name: Install R packages (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo Rscript -e 'install.packages("Rserve", repos="http://rforge.net")'
        sudo Rscript -e 'install.packages(c("multimode", "e1071", "MASS", "statmod", "goftest", "evd", "evir"), repos="https://cloud.r-project.org")'

    - name: Install R packages (macOS)
      if: matrix.os == 'macOS-latest'
      run: |
        Rscript -e 'install.packages("Rserve", repos="http://rforge.net")'
        Rscript -e 'install.packages(c("multimode", "e1071", "MASS", "statmod", "goftest", "evd", "evir"), repos="https://cloud.r-project.org")'

    - name: Start Rserve
      run: |
        R -e "library(Rserve); Rserve(args='--no-save')"

    - name: Prep validation deps
      run: |
        clojure -P -M:validation

    - name: Validation tests
      run: |
        set -x
        clojure -M:validation --reporter dots

    - name: cache clj-kondo configs
      run: |
        set -x
        clj-kondo --lint $(clojure -Spath -A:dev:test) --dependencies --copy-configs --skip-lint

    - name: lint
      run: |
        set -x
        clj-kondo --lint bases projects --fail-level warning
